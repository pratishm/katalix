name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:templates
      - run: |
          if npm run example:debug; then
            echo "example:debug unexpectedly passed"
            exit 1
          else
            test $? -eq 1
          fi
      - run: npm run example:style
      - run: npm run example:web
      - run: npm run example:native
      - run: npm run example:motion
      - run: npm run example:patterns
