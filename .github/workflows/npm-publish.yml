name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      packages:
        description: >
          Packages to publish — comma-separated names, or "all".
          Examples: "@katalix/navigation,@katalix/data" or "katalix"
        required: false
        default: "all"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:templates

      - name: Publish workspaces
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_PACKAGES: ${{ github.event.inputs.packages || 'all' }}
        run: |
          # Returns 0 if the package should be published based on PUBLISH_PACKAGES input
          should_publish() {
            local pkg="$1"
            [ "$PUBLISH_PACKAGES" = "all" ] && return 0
            echo "$PUBLISH_PACKAGES" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -qxF "$pkg"
          }

          # Try to publish once; warn and continue on any failure
          publish() {
            local pkg="$1"
            local output code
            should_publish "$pkg" || { echo "⏩ $pkg skipped (not in selection)"; return 0; }
            echo "→ Publishing $pkg"
            set +e
            output=$(npm publish --workspace "$pkg" --access public 2>&1)
            code=$?
            set -e
            if [ $code -eq 0 ]; then
              echo "✅ $pkg published"
              sleep 5
            elif echo "$output" | grep -qE "E403|cannot publish over"; then
              echo "⏭  $pkg already published, skipping."
            else
              echo "⚠️  $pkg failed (continuing): $(echo "$output" | grep 'npm error' | head -3)"
            fi
          }

          publish "@katalix/core"
          publish "@katalix/tokens"
          publish "@katalix/diagnostics"
          publish "@katalix/motion"
          publish "@katalix/dsl"
          publish "@katalix/react"
          publish "@katalix/react-native"
          publish "@katalix/patterns"
          publish "@katalix/app"
          publish "@katalix/navigation"
          publish "@katalix/data"
          publish "@katalix/storage"
          publish "@katalix/auth"
          publish "@katalix/web"
          publish "@katalix/native"
          publish "@katalix/cli"
          publish "katalix"
