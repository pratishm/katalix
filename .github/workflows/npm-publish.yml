name: Publish Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:templates

      - name: Publish workspaces
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish() {
            local pkg="$1"
            local attempt=0
            local max_attempts=5
            local output code
            echo "→ Publishing $pkg"
            while [ $attempt -lt $max_attempts ]; do
              set +e
              output=$(npm publish --workspace "$pkg" --access public 2>&1)
              code=$?
              set -e
              if [ $code -eq 0 ]; then
                echo "✅ $pkg published"
                sleep 10
                return 0
              elif echo "$output" | grep -qE "E403|cannot publish over"; then
                echo "⏭  $pkg already published, skipping."
                return 0
              elif echo "$output" | grep -qE "E429|rate limit"; then
                attempt=$((attempt + 1))
                wait=$((30 * attempt))
                echo "⚠️  Rate limited. Retry $attempt/$max_attempts in ${wait}s..."
                sleep $wait
              else
                echo "❌ Unexpected error publishing $pkg:"
                echo "$output"
                exit 1
              fi
            done
            echo "❌ Failed to publish $pkg after $max_attempts attempts"
            exit 1
          }

          publish "@katalix/core"
          publish "@katalix/tokens"
          publish "@katalix/diagnostics"
          publish "@katalix/motion"
          publish "@katalix/dsl"
          publish "@katalix/react"
          publish "@katalix/react-native"
          publish "@katalix/patterns"
          publish "@katalix/app"
          publish "@katalix/navigation"
          publish "@katalix/data"
          publish "@katalix/storage"
          publish "@katalix/auth"
          publish "@katalix/web"
          publish "@katalix/native"
          publish "@katalix/cli"
          publish "katalix"