name: Publish Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:templates

      - name: Publish workspaces
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish() {
            local pkg="$1"
            local ver
            ver=$(npm pkg get version --workspace "$pkg" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            if npm view "${pkg}@${ver}" version >/dev/null 2>&1; then
              echo "⏭  ${pkg}@${ver} already published, skipping."
              return 0
            fi
            echo "→ Publishing ${pkg}@${ver}"
            npm publish --workspace "$pkg" --access public
            sleep 4
          }

          publish "@katalix/core"
          publish "@katalix/tokens"
          publish "@katalix/diagnostics"
          publish "@katalix/motion"
          publish "@katalix/dsl"
          publish "@katalix/react"
          publish "@katalix/react-native"
          publish "@katalix/patterns"
          publish "@katalix/app"
          publish "@katalix/navigation"
          publish "@katalix/data"
          publish "@katalix/storage"
          publish "@katalix/auth"
          publish "@katalix/web"
          publish "@katalix/native"
          publish "@katalix/cli"
          publish "katalix"