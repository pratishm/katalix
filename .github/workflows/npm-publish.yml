name: Publish Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:templates

      - name: Publish workspaces
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --workspace @katalix/core --access public
          npm publish --workspace @katalix/tokens --access public
          npm publish --workspace @katalix/diagnostics --access public
          npm publish --workspace @katalix/motion --access public
          npm publish --workspace @katalix/dsl --access public
          npm publish --workspace @katalix/react --access public
          npm publish --workspace @katalix/react-native --access public
          npm publish --workspace @katalix/patterns --access public
          npm publish --workspace @katalix/app --access public
          npm publish --workspace @katalix/navigation --access public
          npm publish --workspace @katalix/data --access public
          npm publish --workspace @katalix/storage --access public
          npm publish --workspace @katalix/auth --access public
          npm publish --workspace @katalix/web --access public
          npm publish --workspace @katalix/native --access public
          npm publish --workspace @katalix/cli --access public
          npm publish --workspace katalix --access public